<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carly's Pond — Stevens SGA Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #163457;
    --pond-top: #6fcdf0;
    --pond-bottom: #1f86bc;
    --foam: #eafcff;
    --card: #fffdf3;
    --orange: #ef8a3f;
    --orange-dark: #cf6c26;
    --deep: #1f6fa8;
    --sun: #ffd977;

    /* mallard palette, sampled from the reference art */
    --head-hi: #7fa25a;
    --head: #56753a;
    --head-lo: #3a5227;
    --bill: #f0b13c;
    --bill-lo: #d4901f;
    --ring: #f6f1e2;
    --body-hi: #e7dcc4;
    --body: #b6a381;
    --body-lo: #8a7657;
    --wing: #6f5f46;
    --feet: #e8763a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-width: 320px; min-height: 100vh; overflow: hidden;
    color: var(--ink);
    font-family: "Silkscreen", monospace;
    background: var(--pond-bottom);
  }
  button, input { font: inherit; }

  .pond {
    isolation: isolate; position: relative; width: 100vw; height: 100vh; min-height: 560px; overflow: hidden;
    background: #4aa5d8 url("../assets/pond_background.gif") center / cover no-repeat;
  }
  /* The animated pond GIF supplies all water and decorative elements. */
  .pond::before { display: none; }
  .pond::after {
    content: ""; position: absolute; inset: 14px; pointer-events: none; z-index: 20;
    border: 4px solid var(--foam); border-radius: 12px;
    box-shadow: inset 0 0 0 4px #1c669f, inset 0 0 0 8px #8dd9f3;
  }

  .hud {
    position: absolute; z-index: 5; top: 27px; left: 30px; right: 30px;
    display: flex; align-items: start; justify-content: space-between;
    color: #fff; text-shadow: 3px 3px 0 #165b91; pointer-events: none;
  }
  .hud h1 { margin: 0; font-size: clamp(16px, 2.5vw, 25px); letter-spacing: 0; line-height: 1.35; }
  .hud p { margin: 7px 0 0; font-size: 8px; line-height: 1.5; }
  .hud .status {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 10px; background: #1f6fa8; border: 3px solid #fff; border-radius: 0; font-size: 8px;
    box-shadow: 4px 4px 0 #165b91;
  }
  .hud .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #7cf7a1; box-shadow: 0 0 6px #7cf7a1; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* reeds + lily pads, softened */
  .reed { position: absolute; bottom: -8px; z-index: 2; width: 64px; height: 180px; transform-origin: bottom; animation: sway 4.5s ease-in-out infinite; opacity: .92; }
  .reed svg { width: 100%; height: 100%; }
  .reed.left { left: -6px; }
  .reed.right { right: -10px; transform: scaleX(-1); animation-delay: .8s; }
  @keyframes sway { 0%, 100% { rotate: -2deg; } 50% { rotate: 2.5deg; } }

  .lily { position: absolute; z-index: 1; animation: bob 4.2s ease-in-out infinite; filter: drop-shadow(0 4px 3px rgba(10,60,90,.18)); }
  .lily svg { display: block; width: 100%; height: 100%; }
  .lily.one { left: 10%; bottom: 17%; width: 84px; height: 46px; }
  .lily.two { right: 10%; bottom: 12%; width: 64px; height: 35px; animation-delay: 1.1s; }
  .lily.three { left: 46%; bottom: 6%; width: 50px; height: 27px; animation-delay: 2s; }
  @keyframes bob { 0%, 100% { translate: 0 0 rotate(-1deg); } 50% { translate: 8px -7px rotate(2deg); } }
  .pond-bubble { position: absolute; z-index: 1; width: 13px; height: 13px; border: 2px solid rgba(234,252,255,.7); border-radius: 50%; animation: bubble-rise 7s ease-in infinite; }
  .pond-bubble::after { content: ""; position: absolute; width: 5px; height: 5px; left: 11px; top: -13px; border: 1px solid rgba(234,252,255,.55); border-radius: 50%; }
  .pond-bubble.a { left: 27%; bottom: 9%; animation-delay: -1s; } .pond-bubble.b { right: 24%; bottom: 19%; animation-delay: -4s; transform: scale(.7); }
  @keyframes bubble-rise { 0% { opacity: 0; translate: 0 10px; } 20%,80% { opacity: .8; } 100% { opacity: 0; translate: 18px -105px; } }
  .dragonfly { position: absolute; z-index: 2; right: 19%; top: 26%; width: 33px; height: 22px; animation: dragonfly 9s ease-in-out infinite; }
  .dragonfly::before, .dragonfly::after { content: ""; position: absolute; width: 18px; height: 9px; border-radius: 90% 10% 90% 10%; background: rgba(222,250,255,.72); border: 1px solid rgba(31,111,168,.5); }
  .dragonfly::before { left: 0; transform: rotate(-24deg); } .dragonfly::after { right: 0; transform: scaleX(-1) rotate(-24deg); }
  .dragonfly span { position: absolute; z-index: 1; left: 14px; top: 7px; width: 7px; height: 11px; border-radius: 50%; background: #ef8a3f; }
  @keyframes dragonfly { 0%,100% { translate: 0 0; rotate: 0deg; } 28% { translate: -75px 30px; rotate: -9deg; } 58% { translate: -150px -24px; rotate: 10deg; } 80% { translate: -65px -46px; } }
  .reed, .lily, .pond-bubble, .dragonfly { display: none; }

  /* --- Carly the duck --- */
  .duck-stage {
    position: absolute; z-index: 4; left: 50%; top: 47%; width: 300px; height: 260px;
    transform: translate(-50%, -50%);
    transition: left .4s ease, top .4s ease;
  }
  .duck-stage.enter { left: -14%; top: 69%; animation: swim-in 2.6s cubic-bezier(.32, .04, .3, 1) forwards; }
  @keyframes swim-in {
    0%   { left: -14%; top: 69%; }
    55%  { left: 30%; top: 58%; }
    100% { left: 47%; top: 54%; }
  }
  .duck-stage.thinking { animation: patrol 7s ease-in-out infinite alternate; }
  @keyframes patrol {
    0%   { left: 20%; top: 63%; rotate: -3deg; }
    30%  { left: 45%; top: 47%; rotate: 2deg; }
    62%  { left: 76%; top: 42%; rotate: -2deg; }
    100% { left: 26%; top: 34%; rotate: 3deg; }
  }
  .duck-stage.answering { animation: dash-to-answer .75s cubic-bezier(.34, 1.4, .4, 1) forwards; }
  @keyframes dash-to-answer { to { left: 50%; top: 45%; } }

  .duck { position: absolute; left: 16px; top: 22px; width: 244px; height: 168px; filter: drop-shadow(4px 7px 3px rgba(12,55,95,.28)); }
  .duck-stage.thinking .duck { animation: paddle 1s ease-in-out infinite; }
  .duck-stage.answering .duck { animation: paddle .5s ease-in-out infinite; }
  @keyframes paddle { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-4px) rotate(-2deg); } }

  .duck img { display: block; width: 100%; height: 100%; object-fit: contain; }

  .wake { position: absolute; left: -14px; bottom: -4px; width: 122px; height: 16px; opacity: .9; }
  .wake svg { width: 100%; height: 100%; }
  .wake path { animation: wake 1.1s ease-in-out infinite; transform-origin: center; }
  @keyframes wake { 0%, 100% { transform: scaleX(1) translateX(0); opacity: .85; } 50% { transform: scaleX(.72) translateX(-6px); opacity: .55; } }

  /* --- speech bubble --- */
  .speech {
    /* Carly's larger bill ends at x=142; the bubble tail starts at x=145. */
    position: absolute; z-index: 12; left: 205px; top: -24px; width: min(340px, calc(53vw - 95px));
    padding: 14px; color: var(--ink); background: var(--card);
    border: 4px solid var(--ink); border-radius: 8px; box-shadow: 5px 5px 0 #165b91;
    transition: opacity .18s linear, transform .18s steps(3);
  }
  .speech::before {
    content: ""; position: absolute; left: -20px; bottom: 18px; width: 20px; height: 20px;
    background: var(--card); border-left: 4px solid var(--ink); border-bottom: 4px solid var(--ink); transform: rotate(45deg);
  }
  .speech label { display: block; margin-bottom: 12px; font-size: 10px; line-height: 1.55; }
  .ask-form { display: flex; gap: 8px; }
  .ask-form input {
    min-width: 0; flex: 1; padding: 9px 12px; color: var(--ink); background: #eef9ff;
    border: 3px solid var(--ink); border-radius: 5px; outline: none; font-size: 10px;
    transition: box-shadow .18s ease, border-color .18s ease, background .18s ease;
  }
  .ask-form input:focus { background: #fff; border-color: var(--deep); box-shadow: 0 0 0 3px rgba(31,111,168,.15); }
  .ask-form button {
    width: 44px; color: #fff; background: var(--orange); border: 3px solid var(--ink); border-radius: 5px; cursor: pointer;
    font-size: 14px; box-shadow: 3px 3px 0 var(--ink);
    transition: transform .12s ease, box-shadow .12s ease, background .18s ease;
  }
  .ask-form button:hover:not(:disabled) { background: #f4995a; }
  .ask-form button:active:not(:disabled) { translate: 0 2px; box-shadow: 0 1px 0 var(--orange-dark); }
  .ask-form button:disabled { opacity: .55; cursor: wait; }
  .speech.hidden { opacity: 0; pointer-events: none; transform: scale(.85) translateY(6px); }

  .thinking-note {
    position: absolute; z-index: 3; top: 18%; left: 50%; transform: translateX(-50%) translateY(-6px);
    display: flex; align-items: center; gap: 8px; padding: 10px 18px; color: #fff; text-align: center;
    background: rgba(31,111,168,.92); border-radius: 999px; border: 2px solid rgba(255,255,255,.75);
    box-shadow: 0 6px 14px rgba(10,60,95,.25); font-weight: 700; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
  }
  .thinking-note.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .thinking-note .ripple { display: inline-flex; gap: 3px; }
  .thinking-note .ripple span { width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: ripple-dot 1.1s ease-in-out infinite; }
  .thinking-note .ripple span:nth-child(2) { animation-delay: .15s; }
  .thinking-note .ripple span:nth-child(3) { animation-delay: .3s; }
  @keyframes ripple-dot { 0%, 100% { opacity: .3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

  .answer-card {
    position: absolute; z-index: 20; left: 50%; top: 58%; width: min(680px, calc(100vw - 44px)); max-height: 36vh; overflow: auto;
    padding: 42px 24px 18px; color: var(--ink); background: var(--card); border: 4px solid var(--ink); border-radius: 10px;
    box-shadow: 6px 6px 0 #165b91;
    transform: translate(-50%, -14%) scale(.75); opacity: 0; pointer-events: none;
  }
  .answer-card.show {
    opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto;
    transition: transform .38s cubic-bezier(.3, 1.4, .4, 1), opacity .25s ease;
  }
  .answer-card::before {
    content: "CARLY SAYS"; position: absolute; z-index: 3; top: 10px; left: 18px; padding: 7px 9px; color: #fff;
    background: var(--orange); border: 3px solid var(--ink); border-radius: 4px; font-size: 9px; letter-spacing: 0;
    box-shadow: 3px 3px 0 var(--ink);
  }
  #answer-content { position: relative; z-index: 2; }
  .answer-card p { margin: 0 0 .9em; line-height: 1.8; font-size: 11px; }
  .answer-card p:last-child { margin-bottom: 0; }
  .answer-card h1, .answer-card h2, .answer-card h3 { margin: .65em 0 .35em; font-family: "Baloo 2", sans-serif; font-size: 1.12em; }
  .answer-card h1:first-child, .answer-card h2:first-child, .answer-card h3:first-child { margin-top: 0; }
  .answer-card ul, .answer-card ol { margin: .35em 0 .75em; padding-left: 1.4em; }
  .answer-card li + li { margin-top: .25em; }
  .answer-card blockquote { margin: .6em 0; padding-left: .7em; border-left: 4px solid var(--orange); }
  .answer-card code { padding: .1em .35em; background: #eef4e2; border-radius: 4px; }
  .answer-card pre { overflow: auto; padding: .7em; background: #eef4e2; border-radius: 10px; white-space: pre-wrap; }
  .answer-card a { color: var(--deep); font-weight: 700; }
  .answer-card .ask-again {
    display: block; margin: 15px auto 0; padding: 9px 16px; color: #fff; background: var(--deep);
    border: none; border-radius: 10px; box-shadow: 0 3px 0 #164e78; cursor: pointer; font-weight: 700;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .answer-card .ask-again:active { translate: 0 2px; box-shadow: 0 1px 0 #164e78; }
  .answer-card.typing #answer-content::after { content: "▋"; display: inline-block; color: var(--orange-dark); animation: typing-cursor .7s steps(2) infinite; }
  @keyframes typing-cursor { 50% { opacity: 0; } }

  @media (max-width: 620px) {
    .hud { top: 24px; left: 22px; right: 22px; }
    .hud p, .hud .status { display: none; }
    .duck-stage { top: 42%; }
    .speech { left: 54px; top: 104px; width: min(330px, calc(100vw - 44px)); }
    .speech::before { left: 30px; top: -14px; transform: rotate(135deg); }
    .answer-card { top: 56%; max-height: 44vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <main class="pond">
    <header class="hud">
      <div><h1>Carly's Pond</h1><p>STEVENS SGA KNOWLEDGE POOL</p></div>
      <div class="status"><span class="dot"></span>ONLINE</div>
    </header>

    <div class="reed left"><svg viewBox="0 0 64 180" xmlns="http://www.w3.org/2000/svg"><path d="M10 180 C6 120 20 90 12 40" stroke="#2f6b47" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M26 180 C22 110 34 80 26 20" stroke="#3d9d67" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M42 180 C40 130 30 100 40 55" stroke="#2f6b47" stroke-width="6" fill="none" stroke-linecap="round"/></svg></div>
    <div class="reed right"><svg viewBox="0 0 64 180" xmlns="http://www.w3.org/2000/svg"><path d="M10 180 C6 120 20 90 12 40" stroke="#2f6b47" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M26 180 C22 110 34 80 26 20" stroke="#3d9d67" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M42 180 C40 130 30 100 40 55" stroke="#2f6b47" stroke-width="6" fill="none" stroke-linecap="round"/></svg></div>

    <div class="pond-bubble a" aria-hidden="true"></div><div class="pond-bubble b" aria-hidden="true"></div>
    <div class="dragonfly" aria-hidden="true"><span></span></div>

    <div class="lily one"><svg viewBox="0 0 84 46" xmlns="http://www.w3.org/2000/svg"><path d="M42 4 C64 4 80 16 80 24 C80 34 64 42 42 42 C20 42 4 34 4 24 C4 16 20 4 42 4 Z M42 24 L64 15 L64 33 Z" fill="#3d9d67" stroke="#227354" stroke-width="3" stroke-linejoin="round"/><circle cx="42" cy="24" r="4" fill="#f9d25b" stroke="#e87d64" stroke-width="2"/></svg></div>
    <div class="lily two"><svg viewBox="0 0 84 46" xmlns="http://www.w3.org/2000/svg"><path d="M42 4 C64 4 80 16 80 24 C80 34 64 42 42 42 C20 42 4 34 4 24 C4 16 20 4 42 4 Z M42 24 L64 15 L64 33 Z" fill="#3d9d67" stroke="#227354" stroke-width="3" stroke-linejoin="round"/><circle cx="42" cy="24" r="4" fill="#f9d25b" stroke="#e87d64" stroke-width="2"/></svg></div>
    <div class="lily three"><svg viewBox="0 0 84 46" xmlns="http://www.w3.org/2000/svg"><path d="M42 4 C64 4 80 16 80 24 C80 34 64 42 42 42 C20 42 4 34 4 24 C4 16 20 4 42 4 Z M42 24 L64 15 L64 33 Z" fill="#3d9d67" stroke="#227354" stroke-width="3" stroke-linejoin="round"/><circle cx="42" cy="24" r="4" fill="#f9d25b" stroke="#e87d64" stroke-width="2"/></svg></div>

    <div class="thinking-note" id="thinking-note">Carly is paddling for an answer <span class="ripple"><span></span><span></span><span></span></span></div>

    <section class="duck-stage enter" id="duck-stage" aria-label="Carly the duck">
      <div class="duck" aria-hidden="true">
        <img id="duck-sprite" src="../assets/idle_duck.gif" alt="">
      </div>
      <div class="wake"><svg viewBox="0 0 122 16" xmlns="http://www.w3.org/2000/svg"><path d="M4 8 Q31 -2 61 8 T118 8" stroke="#eafcff" stroke-width="4" fill="none" stroke-linecap="round"/></svg></div>

      <div class="speech" id="speech">
        <label for="question-input" id="prompt-text">Quack! What would you like to know?</label>
        <form class="ask-form" id="ask-form">
          <input id="question-input" autocomplete="off" placeholder="Ask a question..." aria-label="Ask Carly a question">
          <button id="send-btn" type="submit" aria-label="Ask Carly">➜</button>
        </form>
      </div>
    </section>

    <section class="answer-card" id="answer-card" aria-live="polite">
      <div id="answer-content"></div>
      <button class="ask-again" id="ask-again" type="button">Ask Carly again</button>
    </section>
  </main>
<script>
  const API_URL = "http://localhost:5001/ask";
  const sessionId = crypto.randomUUID();
  const duckStage = document.getElementById("duck-stage"); const speech = document.getElementById("speech"); const promptText = document.getElementById("prompt-text"); const form = document.getElementById("ask-form"); const input = document.getElementById("question-input"); const sendBtn = document.getElementById("send-btn"); const thinkingNote = document.getElementById("thinking-note"); const answerCard = document.getElementById("answer-card"); const answerContent = document.getElementById("answer-content");

  function appendInlineMarkdown(element, text) { const pattern = /(\*\*([^*]+)\*\*|__([^_]+)__|`([^`]+)`|\[([^\]]+)\]\(([^\s)]+)\)|\*([^*]+)\*|_([^_]+)_)/g; let cursor = 0, match; while ((match = pattern.exec(text)) !== null) { element.append(document.createTextNode(text.slice(cursor, match.index))); let child; if (match[2] || match[3]) { child = document.createElement("strong"); child.textContent = match[2] || match[3]; } else if (match[4]) { child = document.createElement("code"); child.textContent = match[4]; } else if (match[5] && /^(https?:|mailto:)/i.test(match[6])) { child = document.createElement("a"); child.href = match[6]; child.target = "_blank"; child.rel = "noopener noreferrer"; child.textContent = match[5]; } else if (match[7] || match[8]) { child = document.createElement("em"); child.textContent = match[7] || match[8]; } else { child = document.createTextNode(match[0]); } element.append(child); cursor = pattern.lastIndex; } element.append(document.createTextNode(text.slice(cursor))); }
  function blockStart(line) { return /^(#{1,3}\s+|[-*+]\s+|\d+[.)]\s+|>\s*|```)/.test(line); }
  function renderMarkdown(element, text) { element.replaceChildren(); const lines = text.replace(/\r\n?/g, "\n").split("\n"); for (let i = 0; i < lines.length;) { if (!lines[i].trim()) { i++; continue; } if (/^```(?:\w+)?\s*$/.test(lines[i])) { const code = []; while (++i < lines.length && !/^```\s*$/.test(lines[i])) code.push(lines[i]); const pre = document.createElement("pre"), codeEl = document.createElement("code"); codeEl.textContent = code.join("\n"); pre.append(codeEl); element.append(pre); if (i < lines.length) i++; continue; } const heading = lines[i].match(/^(#{1,3})\s+(.+)$/); if (heading) { const node = document.createElement(`h${heading[1].length}`); appendInlineMarkdown(node, heading[2]); element.append(node); i++; continue; } const ordered = /^\d+[.)]\s+/.test(lines[i]), bullet = /^[-*+]\s+/.test(lines[i]); if (ordered || bullet) { const list = document.createElement(ordered ? "ol" : "ul"); while (i < lines.length) { const item = ordered ? lines[i].match(/^\d+[.)]\s+(.+)$/) : lines[i].match(/^[-*+]\s+(.+)$/); if (!item) break; const li = document.createElement("li"); appendInlineMarkdown(li, item[1]); list.append(li); i++; } element.append(list); continue; } const quote = lines[i].match(/^>\s*(.*)$/); if (quote) { const node = document.createElement("blockquote"); appendInlineMarkdown(node, quote[1]); element.append(node); i++; continue; } const para = []; while (i < lines.length && lines[i].trim() && !blockStart(lines[i])) para.push(lines[i++]); const node = document.createElement("p"); para.forEach((line, index) => { if (index) node.append(document.createElement("br")); appendInlineMarkdown(node, line); }); element.append(node); } }
  function askAgain() { answerCard.classList.remove("show"); duckStage.classList.remove("answering", "thinking"); duckStage.style.left = "47%"; duckStage.style.top = "54%"; speech.classList.remove("hidden"); promptText.textContent = "Quack! Want to ask another question?"; input.value = ""; input.focus(); }
  form.addEventListener("submit", async (event) => { event.preventDefault(); const question = input.value.trim(); if (!question) return; answerCard.classList.remove("show"); speech.classList.add("hidden"); sendBtn.disabled = true; duckStage.classList.remove("enter", "answering"); duckStage.style.left = ""; duckStage.style.top = ""; duckStage.classList.add("thinking"); thinkingNote.classList.add("visible"); try { const response = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, session_id: sessionId }) }); const data = await response.json(); if (!response.ok) throw new Error(data.error || "The pond is a little choppy."); duckStage.classList.remove("thinking"); duckStage.classList.add("answering"); thinkingNote.classList.remove("visible"); renderMarkdown(answerContent, data.answer); setTimeout(() => answerCard.classList.add("show"), 480); } catch (error) { duckStage.classList.remove("thinking"); thinkingNote.classList.remove("visible"); renderMarkdown(answerContent, "**Carly got tangled in the reeds.** Please make sure `api_server.py` is running, then try again."); answerCard.classList.add("show"); } finally { sendBtn.disabled = false; } });
  document.getElementById("ask-again").addEventListener("click", askAgain);
  setTimeout(() => input.focus(), 2700);
</script>
</body>
</html>
